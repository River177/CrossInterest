config_version: wang-stage-a-matrix-v1
method:
  paper: LLMs for User Interest Exploration in Large-scale Recommendation Systems
  doi: 10.1145/3640457.3688161
  arxiv: "2405.16363"
  scope: high-level language policy only
  response_prefix: "New cluster: "
  context_clusters: 2
  pairs_per_label: 10

data_root: data/training/wang_stage_a_balanced_transition_v1

models:
  qwen35:
    name: Qwen/Qwen3.5-9B
    revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
    requirements: requirements-qwen35-worker.txt
    dependency_installer: scripts/amlt/evaluation/install_qwen35_worker_deps.sh
    learning_rate: 0.00002
    generation_batch_size: 16
    label_batch_size: 16
  qwen2:
    name: Qwen/Qwen2-1.5B
    revision: 8a16abf2848eda07cc5253dec660bf1ce007ad7a
    requirements: requirements-training-worker.txt
    dependency_installer: scripts/amlt/evaluation/install_training_worker_deps.sh
    learning_rate: 0.0001
    generation_batch_size: 32
    label_batch_size: 32

training:
  seed: 42
  enable_thinking: false
  loss_reduction: token_mean
  max_seq_length: 512
  epochs: 7
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  effective_global_batch_size: 16
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  gradient_checkpointing_use_reentrant: false
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: all-linear
  optim: adamw_torch_fused
  logging_steps: 5
  save_strategy: steps
  save_steps: 100
  save_total_limit: 3
  persistent_checkpoint_limit: 3
  dataloader_num_workers: 2
  wandb_mode: disabled

evaluation:
  enable_thinking: false
  max_seq_length: 512
  max_new_tokens: 32
  decode: greedy
  scoring_backend: prefix_cache
  top_k: 10
  cutoffs: [1, 5, 10]
  checkpoint_size: 64

