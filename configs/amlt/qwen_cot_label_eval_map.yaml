description: Qwen3 greedy CoT plus 110-label conditional ranking evaluation

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python --version
    - python -c "import torch; print(torch.__version__, torch.version.cuda)"
    - nvidia-smi

code:
  local_dir: $CONFIG_DIR/../..

target:
  service: sing
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

jobs:
  - name: cot-label-smoke
    sku: 80G1-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
        WANDB_API_KEY: $WANDB_API_KEY
        DATASET_MOUNT_BLOCK_BASED_CACHE_ENABLED: "true"
        PIP_CACHE_DIR: /scratch/pip_cache
        HF_HOME: /mnt/default/huggingface-cache
        HF_HUB_DISABLE_XET: "1"
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p /mnt/default/huggingface-cache /scratch/pip_cache
      - >-
        bash scripts/amlt/evaluation/install_training_worker_deps.sh &&
        bash scripts/amlt/evaluation/run_qwen_cot_label_eval_map.sh smoke

  - name: cot-label-eval-s0
    sku: 80G1-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
        WANDB_API_KEY: $WANDB_API_KEY
        DATASET_MOUNT_BLOCK_BASED_CACHE_ENABLED: "true"
        PIP_CACHE_DIR: /scratch/pip_cache
        HF_HOME: /mnt/default/huggingface-cache
        HF_HUB_DISABLE_XET: "1"
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p /mnt/default/huggingface-cache /scratch/pip_cache
      - >-
        bash scripts/amlt/evaluation/install_training_worker_deps.sh &&
        bash scripts/amlt/evaluation/run_qwen_cot_label_eval_map.sh full 0 4

  - name: cot-label-eval-s1
    sku: 80G1-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
        WANDB_API_KEY: $WANDB_API_KEY
        DATASET_MOUNT_BLOCK_BASED_CACHE_ENABLED: "true"
        PIP_CACHE_DIR: /scratch/pip_cache
        HF_HOME: /mnt/default/huggingface-cache
        HF_HUB_DISABLE_XET: "1"
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p /mnt/default/huggingface-cache /scratch/pip_cache
      - >-
        bash scripts/amlt/evaluation/install_training_worker_deps.sh &&
        bash scripts/amlt/evaluation/run_qwen_cot_label_eval_map.sh full 1 4

  - name: cot-label-eval-s2
    sku: 80G1-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
        WANDB_API_KEY: $WANDB_API_KEY
        DATASET_MOUNT_BLOCK_BASED_CACHE_ENABLED: "true"
        PIP_CACHE_DIR: /scratch/pip_cache
        HF_HOME: /mnt/default/huggingface-cache
        HF_HUB_DISABLE_XET: "1"
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p /mnt/default/huggingface-cache /scratch/pip_cache
      - >-
        bash scripts/amlt/evaluation/install_training_worker_deps.sh &&
        bash scripts/amlt/evaluation/run_qwen_cot_label_eval_map.sh full 2 4

  - name: cot-label-eval-s3
    sku: 80G1-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
        WANDB_API_KEY: $WANDB_API_KEY
        DATASET_MOUNT_BLOCK_BASED_CACHE_ENABLED: "true"
        PIP_CACHE_DIR: /scratch/pip_cache
