description: 'Evaluation only: accepted NI-only and CIR5->NI3; full108 scores, exact
  original Top20 reproduction, paired visible-history exclusion.'
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
  - python --version
  - nvidia-smi
target:
  service: singularity
  name: Recall
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
code:
  local_dir: $CONFIG_DIR/../../artifacts/mind-cir-candidate-competition-20260924/bundle-v1
  ignore:
  - __pycache__/
  - '*.pyc'
jobs:
- name: score-ni-only
  sku: 80G4-A100
  sla_tier: Standard
  submit_args:
    env:
      AMLT_DOCKERFILE_TEMPLATE: DEFAULT
      _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
      COMPETITION_ARM: ni_only
  command:
  - set -euo pipefail
  - cd $$AMLT_CODE_DIR
  - bash scripts/amlt/sft/run_cir_candidate_competition.sh
- name: score-cir5-ni3
  sku: 80G4-A100
  sla_tier: Standard
  submit_args:
    env:
      AMLT_DOCKERFILE_TEMPLATE: DEFAULT
      _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
      COMPETITION_ARM: cir5_ni3
  command:
  - set -euo pipefail
  - cd $$AMLT_CODE_DIR
  - bash scripts/amlt/sft/run_cir_candidate_competition.sh
