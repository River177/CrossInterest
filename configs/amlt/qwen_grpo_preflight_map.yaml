description: Qwen3 SFT22K exact-reward CoT rollout preflight

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python --version
    - python -c "import torch; print(torch.__version__, torch.version.cuda)"
    - nvidia-smi

code:
  local_dir: $CONFIG_DIR/../..

target:
  service: sing
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

jobs:
  - name: grpo-preflight
    sku: 80G1-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - python -m pip install --user --upgrade pip
      - python -m pip install --user --no-warn-script-location -r requirements-training-worker.txt
      - export PYTHONPATH=$$AMLT_CODE_DIR/src$${PYTHONPATH:+:$$PYTHONPATH}
      - export TOKENIZERS_PARALLELISM=false
      - export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - >-
        python -m new_interest.evaluation.preflight_grpo_rewards
        --adapter-path $$AMLT_MAP_INPUT_DIR/sft/final_adapter
        --data-path data/training/grpo_experiments/interest_only/1k.parquet
        --output-dir $$AMLT_OUTPUT_DIR/preflight
        --max-prompts 64
        --num-generations 16
        --batch-size 2
        --temperature 1.0
        --top-p 0.95
        --max-new-tokens 768
