description: Qwen3 SFT22K to GRPO CoT two-step smoke

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python --version

code:
  local_dir: $CONFIG_DIR/../..

target:
  service: sing
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

jobs:
  - name: grpo-smoke
    sku: 80G4-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
        WANDB_API_KEY: $WANDB_API_KEY
        DATASET_MOUNT_BLOCK_BASED_CACHE_ENABLED: "true"
        PIP_CACHE_DIR: /mnt/default/pip_cache
        HF_HOME: /scratch/hf_cache
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p /scratch/hf_cache /mnt/default/pip_cache
      - export PROJECT_DIR=$$AMLT_CODE_DIR
      - export PYTHONPATH=$$AMLT_CODE_DIR/src$${PYTHONPATH:+:$$PYTHONPATH}
      - export WANDB_PROJECT=cross-interest-generative-grpo
      - python -m pip install --user --upgrade pip
      - >-
        python -m pip install --user
        --index-url https://download.pytorch.org/whl/cu126
        torch==2.8.0 torchvision==0.23.0 torchaudio==2.8.0
      - >-
        python -m pip install --user --no-warn-script-location
        -r requirements-verl.lock
      - source scripts/prepare_writable_verl.sh
      - python -c "import torch, transformers, vllm, verl; print(torch.__version__, transformers.__version__, vllm.__version__, verl.__version__)"
      - bash scripts/run_qwen_grpo_map_job.sh interest_only 1k smoke
