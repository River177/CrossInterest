      - python -m pip install --user --no-warn-script-location -r requirements-training-worker.txt
      - export PYTHONPATH=$$AMLT_CODE_DIR/src$${PYTHONPATH:+:$$PYTHONPATH}
      - export TOKENIZERS_PARALLELISM=false
      - export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - export WANDB_PROJECT=cross-interest-generative-sft
      - export WANDB_RESUME=allow
      - export HF_HOME=/scratch/huggingface-cache
      - mkdir -p $$HF_HOME
      - bash scripts/archive/amlt/sft-beam/run_sft_22k_job.sh qwen3 behavior_only

  - name: llama31-interest-22k
    sku: 80G1-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
