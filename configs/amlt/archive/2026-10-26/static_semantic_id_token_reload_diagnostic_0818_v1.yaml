description: Semantic ID Token training-reference versus fresh-reload diagnostic

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python --version
    - python -c "import torch; print(torch.__version__, torch.version.cuda)"
    - nvidia-smi

code:
  local_dir: $CONFIG_DIR/../../../..

target:
  service: sing
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

jobs:
  - name: qwen35-semantic-id-reload-diagnostic
    sku: 80G1-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
        HF_HUB_DISABLE_XET: "1"
        PIP_CACHE_DIR: /scratch/pip_cache
        SEMANTIC_ID_SOURCE_SINGLE: /mnt/output/projects/sft4safety/amlt-results/7212974959.15846-ac67c7e7-fafc/smoke/single
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p /scratch/pip_cache
      - python -m pip install --user --upgrade pip
      - >-
        bash scripts/amlt/evaluation/install_qwen35_worker_deps.sh &&
        bash scripts/archive/amlt/2026-10-26/sft/run_semantic_id_token_reload_diagnostic.sh
        qwen35 training-reference-minimal
