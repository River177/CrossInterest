description: T1 per-example-mean text-label four-condition full SFT, exhaustive likelihood, and Beam evaluation

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python --version
    - python -c "import torch; print(torch.__version__, torch.version.cuda)"
    - nvidia-smi

code:
  local_dir: $CONFIG_DIR/../../../..

target:
  service: sing
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

jobs:
  - name: qwen35-behavior-text-label-t1-full
    sku: 80G4-A100
    sla_tier: Standard
    submit_args:
      env: &common_env
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
        HF_HOME: /mnt/default/huggingface-cache
        HF_HUB_DISABLE_XET: "1"
        PIP_CACHE_DIR: /mnt/default/pip-cache-semantic-id-token
        TEXT_LABEL_ABLATION_NUM_GPUS: "4"
    command: &qwen_command
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p $$HF_HOME $$PIP_CACHE_DIR
      - python -m pip install --user --upgrade pip
      - >-
        bash scripts/amlt/evaluation/install_qwen35_worker_deps.sh &&
        bash scripts/archive/amlt/2026-10-26/sft/run_static_user_disjoint_text_label_ablation.sh qwen35 t1 full

  - name: qwen35-interest-text-label-t1-full
    sku: 80G4-A100
    sla_tier: Standard
    submit_args:
      env: *common_env
    command: *qwen_command

  - name: llama31-behavior-text-label-t1-full
    sku: 80G4-A100
    sla_tier: Standard
    submit_args:
      env: *common_env
    command: &llama_command
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p $$HF_HOME $$PIP_CACHE_DIR
      - python -m pip install --user --upgrade pip
      - >-
        bash scripts/amlt/evaluation/install_semantic_id_token_llama_worker_deps.sh &&
        bash scripts/archive/amlt/2026-10-26/sft/run_static_user_disjoint_text_label_ablation.sh llama31 t1 full

  - name: llama31-interest-text-label-t1-full
    sku: 80G4-A100
    sla_tier: Standard
    submit_args:
      env: *common_env
    command: *llama_command
