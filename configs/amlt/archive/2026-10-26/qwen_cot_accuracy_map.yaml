      - cd $$AMLT_CODE_DIR
      - mkdir -p /mnt/default/huggingface-cache /scratch/pip_cache
      - >-
        bash scripts/amlt/evaluation/install_training_worker_deps.sh &&
        bash scripts/archive/amlt/2026-10-26/evaluation/run_qwen_cot_accuracy_map.sh no_cot 0 1 smoke

  - name: accuracy-cot-s0
    sku: 80G1-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
