        PIP_CACHE_DIR: /mnt/default/pip-cache-wang-stage-a-qwen35
        CUBLAS_WORKSPACE_CONFIG: ":4096:8"
        WANG_NUM_GPUS: "8"
        WANG_REUSE_SFT_DIR: /mnt/output/projects/sft4safety/amlt-results/7211680523.14063-2001c061-1b32/sft
        WANG_EXPECTED_ADAPTER_SHA256: da1e0d45283694f7297b10889f916d0cca146b39bfe0ec7c5f1b71740391ee92
    command:
      - set -euo pipefail
