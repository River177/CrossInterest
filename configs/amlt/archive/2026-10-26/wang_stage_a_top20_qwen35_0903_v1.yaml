      - mkdir -p $$HF_HOME $$PIP_CACHE_DIR
      - python -m pip install --user --upgrade pip
      - bash scripts/amlt/evaluation/install_qwen35_worker_deps.sh && bash scripts/amlt/evaluation/run_wang_stage_a_top20.sh qwen35 grocery
