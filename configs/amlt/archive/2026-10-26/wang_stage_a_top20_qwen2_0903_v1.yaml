description: Wang Stage-A primary held-out Top-20 evaluation-only for accepted Qwen2 adapters; no retraining and no Stage B

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python --version
    - python -c "import torch; print(torch.__version__, torch.version.cuda)"
    - nvidia-smi

code:
  local_dir: $CONFIG_DIR/../../../../amlt_inputs/wang_stage_a_top20_0903_v1

target:
  service: singularity
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

jobs:
  - name: qwen2-arts-top20
    sku: 80G4-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
        HF_HOME: /mnt/default/huggingface-cache
        PIP_CACHE_DIR: /mnt/default/pip-cache-wang-stage-a-qwen2
        CUBLAS_WORKSPACE_CONFIG: ":4096:8"
        WANG_NUM_GPUS: "4"
        WANG_REUSE_SFT_DIR: /mnt/output/projects/sft4safety/amlt-results/7211685101.25446-cef9cea9-d3ad/sft
        WANG_EXPECTED_ADAPTER_SHA256: 06f0fac25a5f81b466d80079b592c8ebb8cf627fa9da848e4ad3ca702b41026b
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p $$HF_HOME $$PIP_CACHE_DIR
      - python -m pip install --user --upgrade pip
      - bash scripts/amlt/evaluation/install_training_worker_deps.sh && bash scripts/amlt/evaluation/run_wang_stage_a_top20.sh qwen2 arts
  - name: qwen2-grocery-top20
    sku: 80G4-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
