        HF_HOME: /mnt/default/huggingface-cache
        PIP_CACHE_DIR: /mnt/default/pip-cache-wang-stage-a-qwen2
        CUBLAS_WORKSPACE_CONFIG: ":4096:8"
        WANG_NUM_GPUS: "4"
        WANG_REUSE_SFT_DIR: /mnt/output/projects/sft4safety/amlt-results/7211685101.25399-74a0a5f6-2b3d/sft
        WANG_EXPECTED_ADAPTER_SHA256: ae2445be15061fa739bdfcd659eefe27fd4e5a2ba2c5b1729790748ff28dba6e
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p $$HF_HOME $$PIP_CACHE_DIR
      - python -m pip install --user --upgrade pip
      - bash scripts/amlt/evaluation/install_training_worker_deps.sh && bash scripts/amlt/evaluation/run_wang_stage_a_top20.sh qwen2 grocery
  - name: qwen2-mind-top20
    sku: 80G4-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
        HF_HOME: /mnt/default/huggingface-cache
        PIP_CACHE_DIR: /mnt/default/pip-cache-wang-stage-a-qwen2
        CUBLAS_WORKSPACE_CONFIG: ":4096:8"
        WANG_NUM_GPUS: "4"
        WANG_REUSE_SFT_DIR: /mnt/output/projects/sft4safety/amlt-results/7211685101.25361-9c5fc6a4-c19e/sft
        WANG_EXPECTED_ADAPTER_SHA256: 1f425966441ddb31795e2082558911ea6196e4cce461f2853c1df8e5cee9fe16
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p $$HF_HOME $$PIP_CACHE_DIR
      - python -m pip install --user --upgrade pip
      - bash scripts/amlt/evaluation/install_training_worker_deps.sh && bash scripts/amlt/evaluation/run_wang_stage_a_top20.sh qwen2 mind
