description: Qwen3.5 Interest Semantic ID Token eval-only recovery from the completed adapter

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python --version
    - python -c "import torch; print(torch.__version__, torch.version.cuda)"
    - nvidia-smi

code:
  local_dir: $CONFIG_DIR/../../../..

target:
  service: singularity
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

jobs:
  - name: qwen35-interest-semantic-id-eval-recovery
    sku: 80G4-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
        HF_HOME: /mnt/default/huggingface-cache
        HF_HUB_DISABLE_XET: "1"
        PIP_CACHE_DIR: /mnt/default/pip-cache-semantic-id-token
        SEMANTIC_ID_NUM_GPUS: "4"
        SEMANTIC_ID_SOURCE_ROOT: /mnt/output/projects/sft4safety/amlt-results/7212919146.88353-1d349268-8286
        SEMANTIC_ID_SOURCE_RESULT_ID: 7212919146.88353-1d349268-8286
        SEMANTIC_ID_STALE_IDENTITY: 29835edbcb8c42d4464e257c618e7a5efc509d3ea4b4d818a8b736ac00fa6f7d
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p $$HF_HOME $$PIP_CACHE_DIR
      - python -m pip install --user --upgrade pip
      - >-
        bash scripts/amlt/evaluation/install_qwen35_worker_deps.sh &&
        bash scripts/archive/amlt/2026-10-26/evaluation/run_semantic_id_token_eval_recovery.sh
