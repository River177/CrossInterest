description: Prefetch and verify the frozen public Qwen2-1.5B snapshot for the original MeRA reproduction
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python --version
code:
  local_dir: $CONFIG_DIR/../../../../amlt_inputs/mera_original_qwen2_0902_v1
target:
  service: sing
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
jobs:
  - name: qwen2-15b-prefetch
    sku: 5C3
    sla_tier: Basic
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
        HF_HOME: /mnt/default/huggingface-cache
        PIP_CACHE_DIR: /mnt/default/pip-cache-mera-qwen2
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p $$HF_HOME $$PIP_CACHE_DIR
      - bash scripts/amlt/sft/prefetch_mera_original_model.sh
