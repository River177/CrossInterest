description: Wang et al. Stage-A balanced-transition full Validation with gated Amazon Test and MIND Dev for Qwen3.5-9B; single-GPU training plus eight-way generation and ranking shards; no Stage B

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python --version
    - python -c "import torch; print(torch.__version__, torch.version.cuda)"
    - nvidia-smi

code:
  local_dir: $CONFIG_DIR/../../../../amlt_inputs/wang_stage_a_qwen35_full_0902_v2

target:
  service: singularity
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

jobs:
  - name: qwen35-arts-balanced-validation-v2
    sku: 80G8-A100
    sla_tier: Standard
    submit_args: &qwen35_env
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
        HF_HOME: /mnt/default/huggingface-cache
        PIP_CACHE_DIR: /mnt/default/pip-cache-wang-stage-a-qwen35
        CUBLAS_WORKSPACE_CONFIG: ":4096:8"
        WANG_NUM_GPUS: "8"
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p $$HF_HOME $$PIP_CACHE_DIR
      - python -m pip install --user --upgrade pip
      - bash scripts/amlt/evaluation/install_qwen35_worker_deps.sh && bash scripts/amlt/sft/run_wang_stage_a.sh qwen35 full-validation arts balanced
  - name: qwen35-grocery-balanced-validation-v2
    sku: 80G8-A100
    sla_tier: Standard
    submit_args: *qwen35_env
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p $$HF_HOME $$PIP_CACHE_DIR
      - python -m pip install --user --upgrade pip
      - bash scripts/amlt/evaluation/install_qwen35_worker_deps.sh && bash scripts/amlt/sft/run_wang_stage_a.sh qwen35 full-validation grocery balanced
  - name: qwen35-mind-balanced-validation-v2
    sku: 80G8-A100
    sla_tier: Standard
    submit_args: *qwen35_env
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p $$HF_HOME $$PIP_CACHE_DIR
      - python -m pip install --user --upgrade pip
      - bash scripts/amlt/evaluation/install_qwen35_worker_deps.sh && bash scripts/amlt/sft/run_wang_stage_a.sh qwen35 full-validation mind balanced
