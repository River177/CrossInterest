description: Wang Stage-A Qwen2-1.5B MIND smoke evaluation recovery using the v2 bit-exact adapter and the chat-template im_end stop token; no retraining

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python --version
    - python -c "import torch; print(torch.__version__, torch.version.cuda)"
    - nvidia-smi

code:
  local_dir: $CONFIG_DIR/../../../../amlt_inputs/wang_stage_a_0902_v3

target:
  service: singularity
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

jobs:
  - name: qwen2-mind-generation-stop-v3
    sku: 80G1-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
        HF_HOME: /mnt/default/huggingface-cache
        PIP_CACHE_DIR: /mnt/default/pip-cache-wang-stage-a-qwen2
        CUBLAS_WORKSPACE_CONFIG: ":4096:8"
        WANG_REUSE_SFT_DIR: /mnt/default/projects/sft4safety/amlt-results/7211690348.49192-f1dc3da0-d87f/sft
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p $$HF_HOME $$PIP_CACHE_DIR
      - python -m pip install --user --upgrade pip
      - >-
        bash scripts/amlt/evaluation/install_training_worker_deps.sh &&
        bash scripts/amlt/sft/run_wang_stage_a.sh qwen2 smoke mind balanced
