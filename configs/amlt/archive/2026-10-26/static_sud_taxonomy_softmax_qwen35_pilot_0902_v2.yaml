description: Recovery Qwen3.5 Behavior+Interest to 108-way Semantic-ID output-only taxonomy-softmax 5.4k pilot using an isolated persistent cache localized to node scratch before four-GPU loading

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python --version
    - python -c "import torch; print(torch.__version__, torch.version.cuda)"
    - nvidia-smi

code:
  local_dir: $CONFIG_DIR/../../../../amlt_inputs/static_sud_taxonomy_softmax_pilot_0902_v2

target:
  service: sing
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

jobs:
  - name: qwen35-bi-taxonomy-softmax-5400
    sku: 80G4-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
        HF_HOME: /mnt/default/huggingface-cache-taxonomy-pilot-v2
        HF_HUB_DISABLE_XET: "1"
        PIP_CACHE_DIR: /mnt/default/pip-cache-qwen35-semantic-id
        SEMANTIC_ID_PILOT_METHOD: taxonomy
        SEMANTIC_ID_LOCALIZE_MODEL_CACHE: "1"
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p $$HF_HOME $$PIP_CACHE_DIR
      - python -m pip install --user --upgrade pip
      - >-
        bash scripts/amlt/evaluation/install_qwen35_worker_deps.sh &&
        bash scripts/amlt/sft/run_static_sud_independent_pilot.sh
