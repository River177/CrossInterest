description: H5 native Trainer diagnostic with hash-checked sequential checkpoint
  staging before Torch deserialization, phase markers and bounded stack traces. Same
  zero-update/at-most25 isolated replay and original scientific checkpoint identities.
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
  - python --version
  - nvidia-smi
target:
  service: singularity
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
code:
  local_dir: $CONFIG_DIR/../../../../artifacts/mind-history-length-ablation-20260915/diagnostics/h5-trainer-v2/bundle
  ignore:
  - __pycache__/
  - '*.pyc'
jobs:
- name: h5-native-trainer-diagnostic
  sku: 80G4-A100
  sla_tier: Standard
  submit_args:
    env:
      AMLT_DOCKERFILE_TEMPLATE: DEFAULT
      _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
  command:
  - set -euo pipefail
  - cd $$AMLT_CODE_DIR
  - bash run_diagnostic.sh 5
