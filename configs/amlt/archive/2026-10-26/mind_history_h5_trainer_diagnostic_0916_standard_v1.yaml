description: H5 isolated native Trainer checkpoint2025 zero-update reconstruction;
  conditionally replay only 2001-2025, compare all parameter/buffer hashes and live
  versus freshly loaded outputs, preserve original artifacts and full budget.
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
  - python --version
  - nvidia-smi
target:
  service: singularity
  name: Recall
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
code:
  local_dir: $CONFIG_DIR/../../../../artifacts/mind-history-length-ablation-20260915/diagnostics/h5-trainer-v1/bundle
  ignore:
  - __pycache__/
  - '*.pyc'
jobs:
- name: h5-native-trainer-diagnostic
  sku: 80G4-A100
  sla_tier: Standard
  submit_args:
    env:
      AMLT_DOCKERFILE_TEMPLATE: DEFAULT
      _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
  command:
  - set -euo pipefail
  - cd $$AMLT_CODE_DIR
  - bash run_diagnostic.sh 5
