description: Three-arm RHO student study with shared deterministic-algorithm backward
  execution, unchanged BF16/TF32/SDPA selection and exact native scalar-weight gradient
  gates. Same data, model initialization and 2025-update budget per formal arm.
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
  - python --version
  - nvidia-smi
target:
  service: singularity
  name: Recall
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
code:
  local_dir: $CONFIG_DIR/../../../../artifacts/rho-student-20260916/bundle-gate-v2
  ignore:
  - __pycache__/
  - '*.pyc'
jobs:
- name: qwen35-2b-rho-student-gate-dynamic-premium-v2
  sku: 80G4-A100
  sla_tier: Premium
  submit_args:
    env:
      AMLT_DOCKERFILE_TEMPLATE: DEFAULT
      _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
  command:
  - set -euo pipefail
  - cd $$AMLT_CODE_DIR
  - bash scripts/amlt/sft/run_rho_student.sh gate dynamic
