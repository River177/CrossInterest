description: 'Paired H50 frequency ablation: singleton CIR 1 epoch then frozen NI
  3 epochs; 9883 identical users per arm, seed42, no class balancing.'
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
  - python --version
  - nvidia-smi
target:
  service: singularity
  name: Recall
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
code:
  local_dir: $CONFIG_DIR/../../../../artifacts/mind-cir-frequency-20260917/singleton/bundle-v1
  ignore:
  - __pycache__/
  - '*.pyc'
jobs:
- name: qwen35-2b-cir-singleton-ni3
  sku: 80G4-A100
  sla_tier: Standard
  submit_args:
    env:
      AMLT_DOCKERFILE_TEMPLATE: DEFAULT
      _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
  command:
  - set -euo pipefail
  - cd $$AMLT_CODE_DIR
  - bash scripts/amlt/sft/run_cir_warmup.sh
