description: Qwen3.5 21.6k Behavior+Interest Semantic-ID adapter continuation smoke on 1,080 GPT-5.5 preference-state trajectories, including full token audit, single-GPU, four-GPU DDP, reload, and held-out format generation gates

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python --version
    - python -c "import torch; print(torch.__version__, torch.version.cuda)"
    - nvidia-smi

code:
  local_dir: $CONFIG_DIR/../../../../amlt_inputs/static_sud_preference_state_reasoning_sft_smoke_0902_v1

target:
  service: sing
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

jobs:
  - name: qwen35-bi-preference-state-reasoning-sft-smoke
    sku: 80G4-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
        HF_HOME: /mnt/default/huggingface-cache-preference-state-sft-v1
        HF_HUB_DISABLE_XET: "1"
        PIP_CACHE_DIR: /mnt/default/pip-cache-qwen35-semantic-id
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p $$HF_HOME $$PIP_CACHE_DIR
      - python -m pip install --user --upgrade pip
      - >-
        bash scripts/amlt/evaluation/install_qwen35_worker_deps.sh &&
        bash scripts/amlt/sft/run_preference_state_reasoning_sft_smoke.sh
