description: Validate the exact OI-to-NI meta objective after aligning BF16 inner backward graph modes on Qwen3.5-2B before a bounded three-condition pilot; longest-input Hessian-vector product, two full 8-class episodes, compact adapter reload and validation predictions.
environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python --version
    - nvidia-smi
target:
  service: singularity
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity
code:
  local_dir: $CONFIG_DIR/../../../../artifacts/mind-oi-ni-meta-20260913/bundle-v2
  ignore:
    - __pycache__/
    - '*.pyc'
jobs:
  - name: qwen35-2b-exact-meta-gate
    sku: 80G1-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - bash scripts/amlt/sft/run_oi_ni_meta.sh gate meta
