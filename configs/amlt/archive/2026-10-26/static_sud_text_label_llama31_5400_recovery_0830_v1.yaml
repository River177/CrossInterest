description: Fresh Llama-3.1-8B-Instruct Behavior+Interest to Text-label 5.4k recovery after the source run completed training and exact adapter reload but rejected its valid checkpoint-500 because the wrapper incorrectly required checkpoint-507

environment:
  image: amlt-sing/acpt-torch2.8.x-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python --version
    - python -c "import torch; print(torch.__version__, torch.version.cuda)"
    - nvidia-smi

code:
  local_dir: $CONFIG_DIR/../../../../amlt_inputs/static_sud_text_label_vanilla_scaling_0830_v3

target:
  service: sing
  name: Feeds
  workspace_name: CS-NewsAndFeeds-Singularity@rg-cs-newsandfeeds-singularity

jobs:
  - name: llama31-bi-text-label-vanilla-5400
    sku: 80G4-A100
    sla_tier: Standard
    submit_args:
      env:
        AMLT_DOCKERFILE_TEMPLATE: DEFAULT
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
        HF_HOME: /mnt/default/huggingface-cache
        PIP_CACHE_DIR: /mnt/default/pip-cache-semantic-id-llama31
        TEXT_LABEL_SCALING_NUM_GPUS: "4"
    command:
      - set -euo pipefail
      - cd $$AMLT_CODE_DIR
      - mkdir -p $$HF_HOME $$PIP_CACHE_DIR
      - python -m pip install --user --upgrade pip
      - >-
        bash scripts/amlt/evaluation/install_semantic_id_token_llama_worker_deps.sh &&
        bash scripts/amlt/sft/run_static_sud_text_label_vanilla_scaling.sh llama31 full 5400
