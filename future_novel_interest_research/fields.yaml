categories:
  identity:
    description: "What the work or dataset is and how to locate the authoritative source."
    fields:
      - name: "name"
        description: "Canonical title or dataset name."
        detail_level: "brief"
      - name: "kind"
        description: "Paper, benchmark, dataset, challenge, or user study."
        detail_level: "brief"
      - name: "venue_year"
        description: "Venue and year, or release/version date for datasets."
        detail_level: "brief"
      - name: "official_sources"
        description: "Original paper and official dataset/project/repository URLs."
        detail_level: "detailed"
      - name: "release_and_license"
        description: "Current public availability, access procedure, version, and license or terms."
        detail_level: "detailed"

  task_semantics:
    description: "Whether the object really matches future novel-interest prediction."
    fields:
      - name: "input_history"
        description: "Observed user history and any profile/context supplied to the model."
        detail_level: "moderate"
      - name: "prediction_target"
        description: "Exact predicted object, label, horizon, and unit of analysis."
        detail_level: "detailed"
      - name: "novel_interest_definition"
        description: "Operational definition of new, novel, shifted, emerging, or serendipitous interest."
        detail_level: "detailed"
      - name: "novelty_granularity_and_reference_window"
        description: "Whether novelty means a new item, leaf category, ancestor category, domain, or semantic distance, and relative to which history window."
        detail_level: "detailed"
      - name: "interest_onset_definition"
        description: "Whether first exposure, click, dwell, cart, purchase, repeat purchase, or later persistence defines interest onset."
        detail_level: "detailed"
      - name: "is_direct_match"
        description: "Direct, adjacent, method-only, dataset-only, or not a match, with reason."
        detail_level: "detailed"
      - name: "persistence_signal"
        description: "Whether repeated later behavior distinguishes sustained adoption from a one-off click."
        detail_level: "moderate"

  method_and_evaluation:
    description: "How the work models and validates the target."
    fields:
      - name: "method"
        description: "Model family, candidate generation, temporal modeling, and objective."
        detail_level: "moderate"
      - name: "evaluation_protocol"
        description: "Split, candidate or negative construction, metrics, baselines, and horizon."
        detail_level: "detailed"
      - name: "generalization_axis"
        description: "Seen versus unseen users, temporal future, cold items, cold categories, or cross-domain shift."
        detail_level: "moderate"
      - name: "exposure_handling"
        description: "Impressions, propensities, randomized exposure, exposed negatives, and never-exposed items."
        detail_level: "detailed"
      - name: "main_findings_and_limits"
        description: "Evidence-backed result and the boundary of the claim."
        detail_level: "detailed"

  dataset_schema:
    description: "Fields needed to reconstruct a leakage-safe history-to-future task."
    fields:
      - name: "scale"
        description: "Users, items, events, sessions or impressions, and temporal coverage."
        detail_level: "detailed"
      - name: "stable_user_identity"
        description: "Whether identities persist across enough time to build history and future windows."
        detail_level: "moderate"
      - name: "timestamps_and_order"
        description: "Timestamp resolution, ordering guarantees, and observation window."
        detail_level: "moderate"
      - name: "left_censoring_and_history_coverage"
        description: "How much pre-target behavior is observed and how unseen pre-dataset interests can be mistaken for new interests."
        detail_level: "detailed"
      - name: "item_semantics"
        description: "Titles, descriptions, tags, category hierarchy, creators, or other semantic metadata."
        detail_level: "detailed"
      - name: "feedback_and_exposure"
        description: "Click, purchase, rating, dwell, watch, impression slate, position, or propensity fields."
        detail_level: "detailed"
      - name: "candidate_space"
        description: "Whether the full contemporaneous catalog or actual exposure candidates can be reconstructed."
        detail_level: "detailed"
      - name: "taxonomy_and_opportunity_drift"
        description: "Taxonomy version, item availability, inventory, geography, release time, and other constraints on whether a target was possible."
        detail_level: "detailed"

  crossinterest_fit:
    description: "Exact feasibility and recommended role for CrossInterest."
    fields:
      - name: "construct_h_f_ynew"
        description: "How, or why not, to construct H(u), F(u), and Y_new(u)=F(u)-H(u)."
        detail_level: "detailed"
      - name: "leakage_and_missingness_risks"
        description: "User leakage, future metadata leakage, MNAR exposure, popularity, seasonality, and category drift."
        detail_level: "detailed"
      - name: "recommended_role"
        description: "Primary benchmark, robustness benchmark, auxiliary subjective/causal validation, method inspiration, or reject."
        detail_level: "detailed"
      - name: "priority"
        description: "High, medium, low, or reject, with concise rationale."
        detail_level: "moderate"
      - name: "verification_status"
        description: "Which claims were verified from primary sources versus secondary or uncertain."
        detail_level: "detailed"
      - name: "repeat_explore_and_persistence_audit"
        description: "Whether evaluation separates repeat from explore and one-off novelty from repeated future adoption."
        detail_level: "detailed"

  evidence:
    description: "Traceable support and unresolved questions."
    fields:
      - name: "evidence_quotes_or_schema_facts"
        description: "Short source-grounded facts sufficient to audit the interpretation."
        detail_level: "detailed"
      - name: "sources"
        description: "URLs paired with the specific claims they support."
        detail_level: "detailed"

uncertain:
  description: >-
    List every field whose value could not be verified from a primary source or
    whose public availability/schema may have changed. Do not silently infer a
    dataset's suitability from its name or from survey summaries.
