[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "new-interest-dataset"
version = "0.1.0"
description = "Build a simplified new-interest dataset from reclassified MINDlarge."
requires-python = ">=3.10"
dependencies = [
  "pyarrow>=16",
]

[project.scripts]
build-new-interest-dataset = "new_interest.data.build_dataset:main"
build-dynamic-new-interest-dataset = "new_interest.data.build_dynamic_dataset:main"
build-dynamic-generative-dataset = "new_interest.data.build_dynamic_generative_dataset:main"
build-future-interest-benchmark = "new_interest.data.build_future_interest_benchmark:main"
build-generative-new-interest-dataset = "new_interest.data.build_generative_dataset:main"
build-sft-subsets = "new_interest.data.build_sft_subsets:main"
build-candidate-selection = "new_interest.data.build_candidate_selection:main"
build-static-user-disjoint-candidate-selection = "new_interest.data.build_static_user_disjoint_candidate_selection:main"
build-static-candidate-pilot = "new_interest.data.build_static_candidate_pilot:main"
build-semantic-id-token-sft-dataset = "new_interest.data.build_semantic_id_token_sft_dataset:main"
build-mera-relations = "new_interest.data.build_mera_relations:main"
build-mera-semantic-id-dataset = "new_interest.data.build_mera_semantic_id_dataset:main"
evaluate-static-candidate-baselines = "new_interest.experiments.evaluate_static_candidate_baselines:main"
run-static-candidate-condition = "new_interest.experiments.run_static_candidate_condition:main"
finalize-static-candidate-pilots = "new_interest.experiments.finalize_static_candidate_pilots:main"
report-static-candidate-results = "new_interest.experiments.report_static_candidate_results:main"
evaluate-id-token-ranking = "new_interest.evaluation.evaluate_id_token_ranking:main"
merge-id-token-shards = "new_interest.evaluation.merge_id_token_shards:main"
build-grpo-datasets = "new_interest.data.build_grpo_dataset:main"
build-grpo-acceptable-targets = "new_interest.data.build_acceptable_target_sets:main"
generate-cot-teacher = "new_interest.data.generate_cot_teacher:main"
build-cot-sft-datasets = "new_interest.data.build_cot_sft_dataset:main"
build-cot-sft-rehearsal = "new_interest.data.build_cot_rehearsal_dataset:main"
evaluate-cot-accuracy = "new_interest.evaluation.evaluate_cot_accuracy:main"
aggregate-cot-accuracy = "new_interest.evaluation.aggregate_accuracy_results:main"
compare-paired-accuracy = "new_interest.evaluation.compare_paired_accuracy:main"
select-cot-v2-preview = "new_interest.data.select_cot_preview:main"
generate-cot-teacher-v2 = "new_interest.data.generate_cot_teacher_v2:main"
render-cot-v2-preview = "new_interest.data.render_cot_preview:main"
evaluate-future-interest = "new_interest.evaluation.evaluate_future_interest:main"
run-future-interest-baselines = "new_interest.experiments.run_future_interest_baselines:main"
report-future-interest-baselines = "new_interest.experiments.report_future_interest_baselines:main"
train-semantic-history-linear-ranker = "new_interest.experiments.tune_semantic_history_linear_ranker:main"
analyze-sft-training-similarity = "new_interest.experiments.analyze_sft_training_similarity:main"
report-sft-training-similarity = "new_interest.experiments.report_sft_training_similarity:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
